name: Daily Angular Job Scraper

on:
  schedule:
    - cron: '0 2 * * *'  # 2:00 AM UTC = 7:30 AM IST
  workflow_dispatch:      # Manual trigger button

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  scrape-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: 📦 Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🎭 Install Playwright Browsers & OS Dependencies
        run: playwright install chromium --with-deps

      - name: 🚀 Execute Scraping & Scoring Pipeline
        run: python main.py

      - name: 💾 Upload Raw Artifacts (CSV + JSON)
        uses: actions/upload-artifact@v4
        with:
          name: daily-job-targets
          path: output/
          retention-days: 7

      - name: 📋 Copy jobs.json into Frontend
        run: cp output/jobs.json frontend/public/jobs.json

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: 📦 Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: 🏗️ Build Frontend for Production
        working-directory: frontend
        run: npm run build
        env:
          VITE_BASE_URL: /angular-job/

      - name: 🚀 Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./frontend/dist

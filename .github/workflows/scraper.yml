name: Daily Angular Job Scraper

on:
  schedule:
    - cron: '0 2 * * *'  # 2:00 AM UTC = 7:30 AM IST
  workflow_dispatch:      # Manual trigger button

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: 📦 Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🎭 Install Playwright Browsers & OS Dependencies
        run: playwright install chromium --with-deps

      - name: 🚀 Execute 5-Agent AI Pipeline
        run: python main.py
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: 💾 Upload Raw Artifacts (CSV + JSON)
        uses: actions/upload-artifact@v4
        with:
          name: daily-job-targets
          path: output/
          retention-days: 7

      - name: 📋 Commit jobs.json for Vercel
        run: |
          cp output/jobs.json frontend/public/jobs.json
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add frontend/public/jobs.json
          git diff --cached --quiet || git commit -m "chore: update jobs.json [skip ci]"
          git push
